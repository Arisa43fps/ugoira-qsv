{
    "extractor": {
        "pixiv": {
            "ugoira": true,
            "metadata": true
        }
    },
    "postprocessors": [
        {
            "name": "python@init",
            "function": "scripts/pximg_rewrite.py:install",
            "whitelist": ["pixiv"]
        },
        {
            "name": "ugoira",
            "extension": "mp4",
            "mode": "concat",
            "framerate": "auto",
            "repeat-last-frame": true,
            "keep-files": false,
            "ffmpeg-output": "error",
            "ffmpeg-args": [
                "-c:v", "hevc_qsv",
                "-global_quality", "14",
                "-preset", "veryslow",
                "-pix_fmt", "yuv420p",
                "-movflags", "+faststart",
                "-an"
            ]
        }
    ],
    "directory": ["downloads"],
    "filename": "{id}.{extension}",
    "base-directory": ".",
    "skip": true,
    "file-unique": true
}
